name: mcp-registry
# Lists io.github.claimidx/claimidx on registry.modelcontextprotocol.io.
# PyPI README must already carry `mcp-name: io.github.claimidx/claimidx` (shipped).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check server.json against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          data = json.loads(Path("server.json").read_text(encoding="utf-8"))
          pkg = re.search(r'(?m)^version = "([^"]+)"', Path("pyproject.toml").read_text(encoding="utf-8")).group(1)
          tag = os.environ["TAG"].removeprefix("v")
          assert tag == pkg, f"tag v{tag} != pyproject {pkg}"
          assert all(p.get("version") == pkg for p in data.get("packages", [])), "packages[].version must equal the PyPI release"
          # data["version"] is the registry envelope (unique, never reused); it may run ahead of the package.
          print(f"registry version {data['version']} -> pypi claimidx {pkg}")
          PY
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
  publish-dispatch:
    # Registry-only metadata refresh; do not re-publish an immutable tag version.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Check registry-only envelope
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path("server.json").read_text(encoding="utf-8"))
          pkg = re.search(r'(?m)^version = "([^"]+)"', Path("pyproject.toml").read_text(encoding="utf-8")).group(1)
          # server.json is published as committed: its top-level version is the registry envelope
          # (bump it in a PR for a metadata-only refresh; the registry refuses a reused version).
          assert all(p.get("version") == pkg for p in data.get("packages", [])), "packages[].version must equal the live PyPI release"
          print(f"registry version {data['version']} -> pypi claimidx {pkg}")
          PY
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate
        run: ./mcp-publisher login github-oidc
      - name: Publish registry-only server.json
        run: ./mcp-publisher publish
  hide-leaked:
    # 0.5.6 contained unintended non-package files and is yanked on PyPI.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate
        run: ./mcp-publisher login github-oidc
      - name: Hide leaked versions
        run: |
          set +e
          out=$(./mcp-publisher status --status deleted --message "Yanked from PyPI. Package contents were incorrect. Use 0.5.8+." io.github.claimidx/claimidx 0.5.6 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then exit 0; fi
          case "$out" in
            *"No changes to apply"*) exit 0 ;;
          esac
          exit "$code"

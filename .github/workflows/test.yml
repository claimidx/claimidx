name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[server,dev]"
      - run: pytest -q
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[server,dev]"
      # The whole loop per ecosystem against real toolchains, in a scratch index. See CONTRIBUTING.md "Ship gates".
      - run: python scripts/live_smoke.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[server,dev]"
      # Same stages as .githooks/pre-commit and pre-push (minus pytest, which the matrix above runs):
      # sanitize, docs, lint, mcp. See CONTRIBUTING.md "Ship gates".
      - run: python scripts/gate.py ci

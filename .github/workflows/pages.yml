name: pages
# Publish the repository's technical documentation and discovery files to a PREVIEW branch.
# The operator's site carries files this checkout does not, so a deploy from here is incomplete
# and must never become production. Production is deployed by the operator from a complete
# docs/ tree with `python scripts/gate.py deploy-site`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name claimidx --branch docs-preview

name: pages
# Storefront HTML (pricing/homes/thanks) is live but not in git.
# A checkout of this repo would publish a site without paid pages.
# Deploy from the operator machine: npx wrangler pages deploy docs --project-name claimidx
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name claimidx

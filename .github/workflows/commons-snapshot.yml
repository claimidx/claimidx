name: commons-snapshot
# The repo's data/claims.jsonl is the offline fallback for `claimidx pull`; the commons is the source.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/commons_snapshot.py
      - name: Commit when the snapshot changed
        run: |
          if git diff --quiet -- data/claims.jsonl; then
            echo "snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/claims.jsonl
          git commit -m "data: snapshot the commons ($(wc -l < data/claims.jsonl) rows)"
          git push

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimidx"
version = "0.5.3"
description = "Prior art for AI agents. Ask a signed claim index before retrying a failure other agents have already paid to solve."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Claimidx" }]
keywords = [
  "agents", "mcp", "a2a", "llm", "fingerprint", "claims", "eval",
  "prior-art", "agent-memory", "debugging", "retry", "skill",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Environment :: Console",
]
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx2>=2"]

[project.urls]
Homepage = "https://claimidx.com"
Documentation = "https://claimidx.com/llms.txt"
"AGENTS.md" = "https://github.com/claimidx/claimidx/blob/main/AGENTS.md"
Protocol = "https://github.com/claimidx/claimidx/blob/main/PROTOCOL.md"
Security = "https://github.com/claimidx/claimidx/blob/main/SECURITY.md"
Skill = "https://github.com/claimidx/claimidx/blob/main/skills/claimidx/SKILL.md"
Ledger = "https://raw.githubusercontent.com/claimidx/claimidx/main/data/claims.jsonl"
Repository = "https://github.com/claimidx/claimidx"
Issues = "https://github.com/claimidx/claimidx/issues"

[project.scripts]
claimidx = "claimidx.cli:main"
claimidx-mcp = "claimidx.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimidx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
